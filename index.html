<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tier List Mage – BCM: MOBILE</title>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0c1c;--panel:#18152d;--panel2:#201c3a;--line:#322d5a;--text:#f2eeff;--mute:#a9a2d0;--acc:#7be0a4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--glow:rgba(123,224,164,.14);--glow2:rgba(140,110,255,.2)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1eefb;--panel:#fff;--panel2:#ece8fa;--line:#d6d0ef;--text:#1b1630;--mute:#5b5480;--acc:#18915a;--glow:rgba(24,145,90,.12);--glow2:rgba(120,90,230,.14)}}
:root[data-theme="light"]{--bg:#f1eefb;--panel:#fff;--panel2:#ece8fa;--line:#d6d0ef;--text:#1b1630;--mute:#5b5480;--acc:#18915a;--glow:rgba(24,145,90,.12);--glow2:rgba(120,90,230,.14)}
:root[data-theme="dark"]{--bg:#0e0c1c;--panel:#18152d;--panel2:#201c3a;--line:#322d5a;--text:#f2eeff;--mute:#a9a2d0;--acc:#7be0a4}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--text);font:400 15px/1.5 Figtree,system-ui,sans-serif;background:radial-gradient(700px 380px at 95% -5%,var(--glow),transparent 70%),radial-gradient(640px 420px at -10% 8%,var(--glow2),transparent 70%),var(--bg);background-attachment:fixed}
main{max-width:760px;margin:0 auto;padding:22px 14px 70px}
.hero{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.hero svg{flex:none;width:74px;height:74px;filter:drop-shadow(0 0 14px var(--glow))}
h1{font:700 46px/.95 Teko,Impact,sans-serif;margin:0;letter-spacing:.5px}
h1 small{display:block;font:500 17px/1.3 Teko,sans-serif;color:var(--acc);letter-spacing:1px;margin-bottom:4px}
p.sub{margin:0 0 16px;color:var(--mute);max-width:58ch}
.tabs{display:flex;gap:4px;margin-bottom:14px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.tabs .chip{flex:1;border:0;background:none;font-size:15px;padding:10px;border-radius:10px;font-weight:600}
input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;margin-bottom:10px}
input:focus{outline:2px solid var(--acc);outline-offset:1px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--mute);padding:7px 14px;border-radius:99px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--acc);color:#0d2418;border-color:var(--acc);font-weight:600}
.chip:focus-visible,.card:focus-visible,.tb:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin:2px 2px 14px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;transform:rotate(45deg)}
.tier{display:flex;margin-bottom:12px;border-radius:16px;overflow:hidden;border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));background:linear-gradient(90deg,color-mix(in srgb,var(--c) 16%,var(--panel)),var(--panel) 55%);min-height:128px;box-shadow:0 6px 22px -12px var(--c)}
.lab{flex:none;width:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#15101f;background:linear-gradient(180deg,var(--c),color-mix(in srgb,var(--c) 70%,#000))}
.lab b{font:700 38px/1 Teko,sans-serif}.lab small{font-size:9px;font-weight:600;text-align:center;line-height:1.1;padding:0 3px;opacity:.85}
.cards{display:flex;flex-wrap:wrap;gap:8px;padding:10px;flex:1;align-content:flex-start}
.card{width:78px;background:none;border:0;padding:0;cursor:pointer;font:inherit;color:inherit;transition:transform .15s}
.card:hover{transform:translateY(-3px)}.card:active{transform:scale(.96)}
.av{position:relative;height:108px;border-radius:12px;overflow:hidden;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 38%,var(--panel2)),var(--panel2));border:1.5px solid var(--c)}
.av img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.av:after{content:"";position:absolute;left:0;right:0;bottom:0;height:56%;background:linear-gradient(transparent,rgba(8,6,20,.92))}
.nm,.vr{position:absolute;left:0;right:0;z-index:1;text-align:center;color:#fff;padding:0 3px}
.nm{bottom:15px;font-size:12px;font-weight:600;line-height:1.1}.vr{bottom:3px;font-size:8.5px;line-height:1.1;color:#d8d2f5;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.rb{position:absolute;top:4px;left:4px;z-index:2;font:700 11px/1 Teko,sans-serif;background:rgba(8,6,20,.78);color:#fff;border-radius:6px;padding:2px 5px}
.empty{color:var(--mute);font-size:13px;align-self:center;padding:0 6px}
.tools{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 4px;color:var(--mute);font-size:13px}
.tools button{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
.note{margin-top:20px;font-size:13px;color:var(--mute);border-left:3px solid var(--acc);padding-left:12px}
#bd{position:fixed;inset:0;background:rgba(5,3,15,.6);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:15}#bd.on{opacity:1;pointer-events:auto}
#sheet{max-height:88vh;overflow-y:auto;position:fixed;left:0;right:0;bottom:0;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .22s;z-index:20;max-width:760px;margin:0 auto;box-shadow:0 -18px 50px -20px #000}
#sheet.open{transform:none}
#sheet h2{margin:0 0 2px;font:700 30px/1 Teko,sans-serif}
#sheet p{margin:0;color:var(--mute);font-size:13px}
.sh{display:flex;gap:14px;align-items:flex-end;margin:-4px -16px 10px;padding:14px 16px 0;background:linear-gradient(180deg,color-mix(in srgb,var(--c,var(--acc)) 28%,var(--panel)),var(--panel));border-radius:22px 22px 0 0}
.sh img{height:150px;flex:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}.sh>div{padding-bottom:14px}
#sheet h3{margin:16px 0 4px;font:700 20px Teko,sans-serif;color:var(--acc);letter-spacing:.5px}
#sheet p.t{color:var(--text);font-size:14px;margin:0}
.tbs{display:flex;gap:6px}
.tb{flex:1;border:0;border-radius:10px;padding:10px 0;font:700 24px Teko,sans-serif;color:#17121f;cursor:pointer}
.tb[aria-current=true]{outline:3px solid var(--text)}
#x{margin-top:14px;width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px;font:inherit;cursor:pointer}
.gi{display:flex;gap:12px;align-items:center;padding:9px 10px;margin-top:6px;background:var(--panel2);border-radius:12px}
.gi img{width:42px;height:42px;object-fit:contain;flex:none}.gi b{font-size:14px}.gi small{display:block;color:var(--mute);font-size:12px;line-height:1.35}
#sheet p.gn{font-size:12px;color:var(--mute);margin-top:10px}
.tm{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;padding:0 14px}
.tm[open]{border-color:var(--acc)}
.tm summary{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 0;font-weight:600;cursor:pointer}
.tm p{font-size:14px;margin:0 0 10px}.tm b{color:var(--acc)}.tm .mg{color:var(--mute);font-size:13px}
.ph{display:flex;gap:8px;margin:0 0 12px}.ph div{width:62px;text-align:center;font-size:10px;line-height:1.15}.ph img{width:58px;height:68px;object-fit:cover;object-position:top;border-radius:10px;border:2px solid;display:block;margin:0 auto 3px;background:var(--panel2)}
.sm{display:flex;gap:4px}.sm img{width:30px;height:34px;object-fit:cover;object-position:top;border-radius:7px;border:1.5px solid}
@media (prefers-reduced-motion:reduce){#sheet,#bd,.card{transition:none}}
.lang{display:flex;gap:4px;justify-content:flex-end;margin-bottom:10px}.lang .chip{padding:5px 11px;font-size:12px}
</style>
</head>
